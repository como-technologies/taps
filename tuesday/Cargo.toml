[workspace]
resolver = "3"
members = ["crates/tuesday-cli", "crates/tuesday-core", "crates/tuesday-web"]

# Shared dependency versions. tuesday-core must stay wasm32-compatible:
# async reqwest, no tokio (ADR-0002); tokio belongs to the heads only.
[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

[profile.server-dev]
inherits = "dev"

[profile.android-dev]
inherits = "dev"
