name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly advisory sweep (Mondays 06:00 UTC): new RUSTSEC advisories land
    # against an unchanged tree, so the audit job re-runs on a schedule. The
    # code lanes skip scheduled runs — they only gate pushes and PRs.
    - cron: '0 6 * * 1'

env:
  CARGO_TERM_COLOR: always

# Least privilege: CI only reads the repo (lint/test/audit, no publishing).
permissions:
  contents: read

jobs:
  test:
    name: workspace tests
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  web-lane:
    name: web feature check
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p tuesday-web --features web

  server-lane:
    name: server feature check
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p tuesday-web --no-default-features --features server

  wasm32-core:
    # tuesday-core must keep compiling for wasm32 (ADR-0002): the web head
    # reuses the same ingestion and report code in the browser. This lane
    # is the guard against tokio or other native-only deps creeping in.
    name: core wasm32 check
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: rustup target add wasm32-unknown-unknown
      - run: cargo check -p tuesday-core --target wasm32-unknown-unknown

  audit:
    # Dependency vulnerability audit — its own job so a fresh advisory reds
    # only this lane and never masks the code gates. Also the only job the
    # weekly schedule runs.
    name: crate audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-audit
      - run: just crate-audit
