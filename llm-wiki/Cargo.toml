[package]
name = "llm-wiki"
version = "0.4.1"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
# Dual-licensed with the upstream copyright retained (LICENSE-MIT names the
# origin project's author) — see the README's credit section.
license = "MIT OR Apache-2.0"
description = "Git-backed wiki engine with MCP/ACP server — bring your own LLM"
readme = "README.md"

[lib]
name = "llm_wiki"
path = "src/lib.rs"

[[bin]]
name = "llm-wiki"
path = "src/main.rs"

# Versions live in the workspace root Cargo.toml.
[dependencies]
# CLI
clap.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true

# Async
tokio.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
toml.workspace = true

# JSON Schema validation
jsonschema.workspace = true

# Hashing
sha2.workspace = true
hex.workspace = true

# Regex
regex.workspace = true

# Full-text search
tantivy.workspace = true

# Graph
petgraph.workspace = true
petgraph-live.workspace = true

# Filesystem traversal
walkdir.workspace = true

# Date/time
chrono.workspace = true

# Stable page identity
ulid.workspace = true

# Git
git2.workspace = true

# MCP server
rmcp.workspace = true
axum.workspace = true

# ACP server
agent-client-protocol.workspace = true
tokio-util.workspace = true
notify.workspace = true

[dev-dependencies]
tempfile.workspace = true
