# cargo-audit configuration (honored by `just crate-audit` locally and in CI).

[advisories]
# RUSTSEC-2026-0194 — quick-xml: quadratic run time when checking a start tag
# for duplicate attribute names. RUSTSEC-2026-0195 — quick-xml: unbounded
# namespace-declaration allocation in `NsReader` (memory-exhaustion DoS).
# Both hit quick-xml 0.39.4. Accepted 2026-07-04.
#
# Why accepted rather than fixed:
# - Structural: no fix path exists today. quick-xml is pulled in only by
#   object_store 0.13.2 (amaker-core's blob-storage layer), which pins
#   quick-xml ^0.39 — `cargo update -p quick-xml` locks 0 packages — and
#   the newer object_store 0.14.0 still resolves quick-xml 0.40.1, below
#   the advisories' patched range (`cargo audit` reports the fix as
#   ">=0.41.0" for both).
# - Threat model: quick-xml here only parses XML replies from the
#   operator-configured S3-compatible/GCS endpoint (object_store list and
#   multipart responses) — trusted, configured infrastructure, not
#   untrusted user input.
# - Removal trigger: an object_store release that resolves quick-xml
#   >=0.41.0 ships -> delete both entries, `cargo update`, and confirm
#   `cargo audit` is clean.
ignore = ["RUSTSEC-2026-0194", "RUSTSEC-2026-0195"]
