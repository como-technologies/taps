[workspace]
resolver = "2"
members = [
    "crates/amaker-analyze",
    "crates/amaker-assess",
    "crates/amaker-author",
    "crates/amaker-cli",
    "crates/amaker-core",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/como-technologies/assessments"
authors = ["Mike Sandman <mike@thesandmans.com>"]

[workspace.dependencies]
# Web framework
axum = { version = "0.8", features = ["multipart", "macros"] }
axum-extra = { version = "0.12", features = ["form"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }

# Templating
askama = "0.16"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Regex
regex = "1"

# LLM framework. Pinned to a post-0.35.0 main revision that contains
# the fix for issue #1642 / PR #1659 — empty-content end_turn responses
# from Anthropic after a tool round-trip used to surface as fatal
# ResponseErrors. Switch back to a release tag once one ships including
# this commit.
rig-core = { git = "https://github.com/0xPlaygrounds/rig", rev = "ac51cf4" }

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Google Cloud Logging structured-JSON formatter — see amaker_core::observability.
tracing-stackdriver = "0.10"
dotenvy = "0.15"
tokio-stream = "0.1"
futures = "0.3"
schemars = { version = "1.2.1", features = ["uuid1", "chrono04"] }
jsonschema = "0.46"
toml = "1"
dashmap = "6"
tempfile = "3"

# Cloud-agnostic blob storage abstraction. Carries its own backends —
# LocalFileSystem (dev / single-VM), InMemory (tests + quick experiments),
# AmazonS3 (the S3 *protocol* implementation; speaks to rustfs, R2, B2,
# GCS-via-S3-interop, etc. with a configurable endpoint),
# GoogleCloudStorage (GCP-native API).
object_store = { version = "0.13", features = ["aws", "gcp"] }
bytes = "1"

[workspace.dependencies.insta]
version = "1"
features = ["yaml"]

[profile.release]
strip = true
lto = true
codegen-units = 1
