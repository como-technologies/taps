name: Deploy Books to GitHub Pages

# One workflow publishes every product's book under one site with
# per-product paths. The portfolio book is the reader-facing front door.

on:
  push:
    branches: [main]
    paths:
      - "*/docs/**"
      - "docs-theme/**"
      - ".github/workflows/pages.yml"
      - "justfile"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: taiki-e/install-action@v2
        with:
          tool: just,mdbook,mdbook-mermaid

      - name: Assemble the site
        run: just site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
