[package]
name = "conduit"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license = "Apache-2.0"
description = "Harness-first execution store for the Adopt stage of the Como TAPS loop"

# Versions live in the workspace root Cargo.toml.
[dependencies]
# Binary-layer errors; typed thiserror enums live in the lib modules.
anyhow.workspace = true
# The doors' seams: KB transport (async, rmcp under the hood) + the MCP
# server door + tool-parameter schemas (the one-clap-definition pattern).
async-trait.workspace = true
como-kb-client = { path = "../kb-client" }
clap.workspace = true
rmcp.workspace = true
schemars.workspace = true
# Work-item page ids (26-char Crockford strings in frontmatter).
ulid.workspace = true
# The door verbs are async (the KB client is); one runtime per invocation.
tokio.workspace = true
serde.workspace = true
# `-o json` reports and the schema-sync tests.
serde_json.workspace = true
# Work-item page frontmatter (the approval seal rides YAML frontmatter).
serde_yaml_ng.workspace = true
# The approval seal's body hash.
sha2.workspace = true
# Typed errors in the lib modules (anyhow stays in main.rs).
thiserror.workspace = true
# Door timestamps (created/claimed_at/approval.at, work_ms measurement).
time.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true
