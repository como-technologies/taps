[package]
name = "adroit"
description = "Decision records for the taps loop — the only writer of the KB's decision pages"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
repository.workspace = true
authors.workspace = true

[lib]
name = "adroit"
path = "src/lib.rs"

[[bin]]
name = "adroit"
path = "src/main.rs"

[dependencies]
# The suite's shared seams: `Status` and the `plan -o json` envelope live in
# como-contract so conduit deserializes exactly what adroit serializes.
como-contract = { workspace = true, features = ["schemars"] }
como-kb-client = { path = "../kb-client" }

anyhow = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true }
rmcp = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
ulid = { workspace = true }
