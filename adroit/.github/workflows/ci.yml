name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly advisory sweep (Mondays 06:00 UTC): new RUSTSEC advisories land
    # against an unchanged tree, so the audit job re-runs on a schedule. The
    # full gate skips scheduled runs — it only gates pushes and PRs.
    - cron: '0 6 * * 1'

env:
  CARGO_TERM_COLOR: always

# Least privilege: CI only reads the repo (fmt/lint/test/book/audit, no
# publishing). Applies to every job that doesn't set its own.
permissions:
  contents: read

jobs:
  check:
    name: Check, Lint, Test
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: just,mdbook,cargo-outdated,cargo-audit

      - name: CI
        run: just ci

  audit:
    # Dependency vulnerability audit — the only job the weekly schedule runs,
    # so a fresh advisory surfaces against an unchanged tree. Pushes and PRs
    # already audit via `just ci` (crate-audit), so this lane is schedule-only.
    name: crate audit
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-audit

      - name: Audit
        run: just crate-audit
